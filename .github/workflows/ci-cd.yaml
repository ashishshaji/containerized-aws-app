name: Docker CI/CD (Docker Hub + EC2)

on:
  push:
   branches: [ "main", "master" ]
  workflow_dispatch:

env:
  DOCKERHUB_REPOSITORY: game2048     # repo name on Docker Hub (lowercase)
  CONTAINER_NAME: game2048
  APP_PORT: 8080

jobs:
  CI-build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test with Maven
        run: mvn -B clean package --file pom.xml

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image to Docker Hub
        id: image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "DOCKERHUB_USERNAME is empty" >&2
            exit 1
          fi

          IMAGE="$DOCKERHUB_USERNAME/${{ env.DOCKERHUB_REPOSITORY }}"

          docker build -f ./Dockerfile -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"

      - name: Add build summary to GitHub Actions
        run: |
          echo "## 🔨 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "------------------" >> $GITHUB_STEP_SUMMARY
          echo "🐳 Image pushed to Docker Hub: ${{ steps.image.outputs.name }}" >> $GITHUB_STEP_SUMMARY
          echo "🕒 Build Time: $(date)" >> $GITHUB_STEP_SUMMARY

  CD:
    needs: CI-build

    runs-on: ubuntu-latest
    env:
      EC2_HOST: '3.94.163.95'
    steps:
      - name: Configure SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 600 /dev/null key.pem
          echo "$EC2_SSH_KEY" > key.pem

      - name: Login to Docker Hub on EC2
        env:
          EC2_HOST: ${{ env.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | ssh -o StrictHostKeyChecking=no -i key.pem \
            "$EC2_USER@$EC2_HOST" \
            "docker login -u '$DOCKERHUB_USERNAME' --password-stdin"

      - name: Stop existing containers on EC2
        env:
          EC2_HOST: ${{ env.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no -i key.pem "$EC2_USER@$EC2_HOST" \
            bash -s -- "$CONTAINER_NAME" <<'EOF'
          set -e
          CONTAINER_NAME="$1"

          # Remove the previous container of this app, if any
          docker rm -f "$CONTAINER_NAME" || true

          # Stop any other container publishing port 8080
          OTHERS=$(docker ps -q --filter "publish=8080")
          if [ -n "$OTHERS" ]; then
            echo "Stopping other containers on port 8080: $OTHERS"
            docker stop $OTHERS
            docker rm $OTHERS
          fi
          EOF

      - name: Deploy new image on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no -i key.pem "$EC2_USER@$EC2_HOST" \
            bash -s -- "$IMAGE" "${{ github.sha }}" "$CONTAINER_NAME" <<'EOF'
          set -e
          IMAGE="$1"; TAG="$2"; CONTAINER_NAME="$3"

          docker pull "$IMAGE:$TAG"
          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            -p 8080:8080 \
            "$IMAGE:$TAG"
          docker image prune -f
          EOF

      - name: Health check
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          for i in $(seq 1 10); do
            if curl -fs "http://$EC2_HOST:8080" > /dev/null; then
              echo "App is up"
              exit 0
            fi
            echo "Waiting for app... ($i/10)"
            sleep 6
          done
          echo "Health check failed" >&2
          exit 1

      - name: Remove SSH key
        if: always()
        run: rm -f key.pem

