name: Docker CI/CD (Docker Hub + EC2)

on:
  push:
   branches: [ "main", "master" ]
  workflow_dispatch:

env:
  DOCKERHUB_REPOSITORY: game2048     # repo name on Docker Hub (lowercase)
  CONTAINER_NAME: game2048
  APP_PORT: 8080

jobs:
  CI:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test with Maven
        run: mvn -B clean package --file pom.xml

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image name
        id: image
        run: echo "name=${{ vars.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY }}:latest" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}
            ${{ vars.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY }}:latest

      - name: Add build summary to GitHub Actions
        run: |
          echo "## 🔨 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "------------------" >> $GITHUB_STEP_SUMMARY
          echo "🐳 Image pushed to Docker Hub: ${{ steps.image.outputs.name }}" >> $GITHUB_STEP_SUMMARY
          echo "🕒 Build Time: $(date)" >> $GITHUB_STEP_SUMMARY

